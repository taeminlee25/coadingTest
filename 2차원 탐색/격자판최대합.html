<html>

<head>
    <meta charset="UTF-8">
    <title>출력결과</title>
</head>

<body>
    <script>
        function solution(arr) {
            let answer = Number.MIN_SAFE_INTEGER;
            let n = arr.length;

            let rowSum = 0;
            let colSum = 0;

            // 행, 열 합 먼저
            for (let i = 0; i < n; i++) {
                rowSum = colSum = 0;
                for (let j = 0; j < n; j++) {
                    rowSum += arr[i][j];
                    colSum += arr[j][i];
                }
                answer = Math.max(answer, rowSum, colSum);
            }

            let traceSum = 0;
            let reverseTraceSum = 0;

            for (let i = 0; i < n; i++) {
                traceSum += arr[i][i];
                reverseTraceSum += arr[i][n - i - 1];
            }

            answer = Math.max(answer, traceSum, reverseTraceSum);

            return answer;
        }

        let arr =
            [[10, 13, 10, 12, 15],
            [12, 39, 30, 23, 11],
            [11, 25, 50, 53, 15],
            [19, 27, 29, 37, 27],
            [19, 13, 30, 13, 19]];

        console.log(solution(arr));
    </script>
</body>

</html>

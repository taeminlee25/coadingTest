<html>

<head>
    <meta charset="UTF-8">
    <title>출력결과</title>
</head>

<body>
    <script>
        /*
            전위순회, 중위순회, 후위순회를 연습해보시오
        */
        function solution(n) {
            let answer = ""
            function DFS(L) {
                if (L > 7) return

                DFS(L * 2)
                DFS(L * 2 + 1)
                answer += (" " + L)
            }
            DFS(n)
            return answer.trim()
        }

        console.log(solution(1));
    </script>
</body>

</html>

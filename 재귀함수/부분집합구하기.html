<html>

<head>
    <meta charset="UTF-8">
    <title>출력결과</title>
</head>

<body>
    <script>
        /*
        자연수 N이 주어지면 1부터 N까지의 원소를 갖는 집합의 부분집합을 모두 출력하는 프로그램
        을 작성하세요.
        */
        function solution(n) {
            let answer = [];
            let ch = Array.from({ length: n + 1 }, () => 0)
            function DFS(L) {
                if (L === n + 1) {
                    let tmp = ""

                    for (let i = 1; i < ch.length; i++) {
                        if (ch[i] === 1) {
                            tmp += (" " + i)
                        }
                    }

                    if (tmp !== "") {
                        answer.push(tmp.trim())
                    }

                    return
                }


                ch[L] = 1 // 있다.
                DFS(L + 1)

                ch[L] = 0 // 없다.
                DFS(L + 1)
            }
            DFS(1)
            return answer;
        }

        console.log(solution(3));
    </script>
</body>

</html>

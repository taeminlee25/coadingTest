<html>

<head>
    <meta charset="UTF-8">
    <title>출력결과</title>
</head>

<body>
    <script>
        /*
            10진수 N이 입력되면 2진수로 변환하여 출력하는 프로그램을 작성하세요. 
            단 재귀함수를 이용해서 출력해야 합니다.
        */
        function solution(n) {
            let answer = "";
            function DFS(L) {
                if (L === 0) {
                    return
                }
                DFS(Math.floor(L / 2))
                answer += L % 2
            }
            DFS(n)
            return answer
        }

        console.log(solution(11));
    </script>
</body>

</html>

<html>

<head>
    <meta charset="UTF-8">
    <title>출력결과</title>
</head>

<body>
    <script>
        /*
        10이하의 N개의 자연수가 주어지면 
        이 중 M개를 뽑아 일렬로 나열하는 방법을 모두 출력합니다.
        */
        function solution(m, arr) {
            let answer = 0;
            let ch = Array.from({ length: arr.length }, () => 0)
            let tmp = Array.from({ length: m }, () => 0)
            function DFS(L) {
                if (L === m) {
                    console.log(tmp.join(" "))
                    answer++
                    return
                }
                for (let i = 0; i < arr.length; i++) {
                    if (ch[i] === 0) {
                        ch[i] = 1
                        tmp[L] = arr[i]
                        DFS(L + 1)
                        ch[i] = 0
                    }
                }
            }
            DFS(0)
            return answer;
        }
        let arr = [3, 6, 9];
        console.log(solution(2, arr));
    </script>
</body>

</html>

<html>

<head>
    <meta charset="UTF-8">
    <title>출력결과</title>
</head>

<body>
    <script>
        function countDVDs(songs, capacity) {
            let cnt = 1;
            let sum = 0;

            for (let x of songs) {
                if (sum + x > capacity) {
                    cnt++
                    sum = x;
                } else {
                    sum += x
                }
            }
            return cnt
        }


        function solution(m, songs) {
            let answer;

            let low = Math.max(...songs)
            let high = songs.reduce((a, b) => a + b)

            // 이분검색
            while (low <= high) {
                let mid = Math.floor((low + high) / 2)

                if (countDVDs(songs, mid) <= m) {
                    answer = mid
                    high = mid - 1
                } else {
                    low = mid + 1
                }
            }

            return answer;
        }

        let arr = [1, 2, 3, 4, 5, 6, 7, 8, 9];
        console.log(solution(3, arr));
    </script>
</body>

</html>

<html>

<head>
    <meta charset="UTF-8">
    <title>출력결과</title>
</head>

<body>
    <script>
        function solution(times) {
            let answer = Number.MIN_SAFE_INTEGER
            let timeline = []
            for (let x of times) {
                timeline.push([x[0], 's']) // 도착시간
                timeline.push([x[1], 'e']) // 떠난시간

            }
            timeline.sort((a, b) => {
                if (a[0] !== b[0]) {
                    return a[0] - b[0]
                } else {
                    return a[1].localeCompare(b[1])
                }
            })
            let cnt = 0;
            for (let ev of timeline) {
                if (ev[1] === 's') {
                    cnt++;
                } else {
                    cnt--
                }
                answer = Math.max(answer, cnt)
            }
            return answer;
        }

        let arr = [[14, 18], [12, 15], [15, 20], [20, 30], [5, 14]];
        console.log(solution(arr));
    </script>
</body>

</html>

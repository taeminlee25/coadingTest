<html>

<head>
    <meta charset="UTF-8">
    <title>출력결과</title>
</head>

<body>
    <script>
        function solution(size, arr) {
            let cache = Array.from({ length: size }, () => 0)

            arr.forEach(x => {
                // 캐시에서 위치 찾기
                let pos = cache.indexOf(x)

                // 캐시 히트
                if (pos !== -1) {
                    // 기존 제거
                    cache.splice(pos, 1)
                } // 캐시 미스
                else {
                    if (cache.length === size) {
                        cache.pop()
                    }
                }

                // 맨 앞 추가
                cache.unshift(x)

            })

            return cache;
        }

        let arr = [1, 2, 3, 2, 6, 2, 3, 5, 7];
        console.log(solution(5, arr));
    </script>
</body>

</html>

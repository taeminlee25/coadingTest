<html>

<head>
    <meta charset="UTF-8">
    <title>출력결과</title>
</head>

<body>
    <script>
        function solution(meeting) {
            let answer = 0;

            // 먼저 끝나는 순서대로 정렬한다.
            meeting.sort((a, b) => {
                // 끝나는 시간이 같으면, 시작 시간이 빠른 순서대로 정렬
                if (a[1] !== b[1]) {
                    return a[1] - b[1]
                } else {
                    return a[0] - b[0]
                }
            })

            let endTime = 0;

            for (let x of meeting) {
                if (x[0] >= endTime) {
                    answer++;
                    endTime = x[1]
                }
            }

            return answer;
        }

        let arr = [[1, 4], [2, 3], [3, 5], [4, 6], [5, 7]];
        console.log(solution(arr));
    </script>
</body>

</html>

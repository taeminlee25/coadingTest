<body>
    <script>

        function isPrime(num) {
            if (num === 1) return false;
            for (let i = 2; i <= parseInt(Math.sqrt(num)); i++) {
                if (num % i === 0) {
                    return false;
                }
            }
            return true;
        }
        // 소수 = 1보다 큰 자연수 중, 1과 자기 자신만을 약수로 가지는 수
        function solution(arr) {
            let answer = [];
            for (let x of arr) {
                // 뒤집기
                let res = 0;
                while (x) {
                    let t = x % 10;
                    res = res * 10 + t;
                    x = parseInt(x / 10);
                }
                if (isPrime(x)) {
                    answer.push(x)
                }

            }
        }

        let arr = [32, 55, 62, 20, 250, 370, 200, 30, 100];
        console.log(solution(arr));
    </script>
</body>
